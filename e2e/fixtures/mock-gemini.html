<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gemini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1b1b1f;
      --surface:   #28282c;
      --surface2:  #35353a;
      --border:    rgba(255,255,255,0.12);
      --text:      #e3e2e6;
      --text-dim:  rgba(227,226,230,0.55);
      --accent:    #4285f4;
      --user-bubble: #004a77;
      --radius:    28px;
    }

    html, body { height: 100%; font-family: "Google Sans", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* ── Shell ── */
    .shell { display: flex; height: 100vh; }

    /* ── Narrow sidebar ── */
    .sidebar {
      width: 56px; min-width: 56px;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; padding: 10px 0; gap: 2px;
      border-right: 1px solid var(--border);
    }
    .sidebar-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: transparent; border: none; color: var(--text-dim);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s;
    }
    .sidebar-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; flex-shrink: 0;
    }
    .logo-text { font-size: 20px; font-weight: 400; color: var(--text); }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .upgrade-btn-top {
      display: flex; align-items: center; gap: 6px;
      background: var(--accent); color: #fff;
      padding: 7px 16px; border-radius: 20px; border: none;
      font: 500 13px "Google Sans", sans-serif; cursor: pointer;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #4285f4, #a142f4);
      font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1; overflow-y: auto; display: flex;
      flex-direction: column; align-items: center;
      padding: 24px 0 16px;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

    /* ── Greeting ── */
    .greeting {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; margin: auto 0; text-align: center; padding: 0 24px;
    }
    .greeting.hidden { display: none; }
    .greeting-hi  { font-size: 28px; font-weight: 400; color: var(--text); }
    .greeting-sub { font-size: 28px; font-weight: 400; color: var(--text-dim); }

    /* ── Messages ── */
    .msg-wrap { width: 100%; max-width: 720px; padding: 0 24px; }
    .msg { display: flex; gap: 12px; padding: 12px 0; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    }
    .msg.user   .msg-avatar { background: linear-gradient(135deg, #4285f4, #a142f4); }
    .msg.gemini .msg-avatar { background: transparent; }
    .msg-body { max-width: 78%; }
    .msg.user   .msg-body { background: var(--user-bubble); padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 14.5px; line-height: 1.55; }
    .msg.gemini .msg-body { font-size: 14.5px; line-height: 1.7; color: var(--text); padding: 4px 0; }

    /* Typing dots */
    .typing-dots { display: flex; gap: 4px; padding: 6px 0; }
    .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); animation: dot-pulse 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    /* ── Input zone ── */
    .input-zone {
      flex-shrink: 0; padding: 0 20px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .input-container {
      width: 100%; max-width: 720px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); position: relative;
    }

    /* Textarea row */
    .textarea-row { padding: 16px 16px 0; }
    rich-textarea { display: block; }
    .ql-editor {
      min-height: 26px; max-height: 180px; overflow-y: auto;
      font: 400 15px/1.5 "Google Sans", sans-serif;
      color: var(--text); outline: none; white-space: pre-wrap; word-break: break-word;
    }
    .ql-editor:empty::before { content: "Ask Gemini"; color: var(--text-dim); pointer-events: none; }

    /* Bottom controls row */
    .controls-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 8px 8px 12px;
    }
    .controls-left { display: flex; align-items: center; gap: 2px; }
    .controls-right { display: flex; align-items: center; gap: 4px; }

    .icon-btn-sm {
      height: 36px; border-radius: 18px; border: none;
      background: transparent; color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; gap: 6px; padding: 0 10px;
      font: 400 13px "Google Sans", sans-serif;
      transition: background 0.12s;
    }
    .icon-btn-sm:hover { background: rgba(255,255,255,0.08); color: var(--text); }

    /* ── Model picker trigger ──────────────────────────────────────────
       Matches real Gemini: inline button at bottom-right of input area.
       content.js targets via:
         1. [data-test-id="bard-mode-menu-button"]
         2. button.input-area-switch                                     */
    .input-area-switch {
      display: flex; align-items: center; gap: 4px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text); padding: 5px 10px; border-radius: 18px;
      cursor: pointer; font: 500 13px "Google Sans", sans-serif;
      white-space: nowrap; transition: background 0.15s; flex-shrink: 0;
    }
    .input-area-switch:hover { background: rgba(255,255,255,0.08); }

    /* Send / mic button */
    .send-button {
      width: 36px; height: 36px; border-radius: 50%; border: none; flex-shrink: 0;
      background: transparent; color: var(--text-dim); cursor: default;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .send-button .icon-send { display: none; }
    .send-button .icon-mic  { display: flex; }
    .send-button:not([disabled]) { background: var(--text); color: #000; cursor: pointer; }
    .send-button:not([disabled]) .icon-send { display: flex; }
    .send-button:not([disabled]) .icon-mic  { display: none; }

    /* ── Mode picker (verified October 2026) ─────────────────────────
       Mirrors the real <gem-menu data-test-id="gem-mode-menu"> overlay:
       appended to <body> when open, removed when closed. */
    gem-menu {
      display: block; padding: 6px 0;
      background: #2d2d31; border-radius: 16px;
      min-width: 220px; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);
      z-index: 1000;
    }
    gem-menu-item { display: block; cursor: pointer; }
    gem-menu-item:hover { background: rgba(255,255,255,0.07); }
    gem-menu-item[aria-disabled="true"] { opacity: 0.45; cursor: default; }
    gem-menu-item-content {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px;
    }
    .leading-container {
      width: 18px; flex-shrink: 0; color: var(--text);
      display: flex; align-items: center;
    }
    .label-container { flex: 1; display: flex; flex-direction: column; }
    .label-container .label { font-size: 14px; color: var(--text); }
    .label-container .sublabel { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
    mat-divider { display: block; height: 1px; margin: 4px 0; background: var(--border); }
    .picker-secondary-text { color: var(--text-dim); margin-left: 4px; }

    /* ── Chips ── */
    .chips-row {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      max-width: 700px; width: 100%;
    }
    .chips-row.hidden { display: none; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 8px 16px; border-radius: 20px;
      font: 400 13px "Google Sans", sans-serif; cursor: pointer;
      transition: background 0.12s; white-space: nowrap;
    }
    .chip:hover { background: var(--surface2); }
  </style>
</head>
<body>
<div class="shell">

  <!--
  Hidden file input for upload simulation.
  content.js pasteImageToInput() dispatches a `change` event here via
  findGeminiFileInput(). The inline script below listens and creates
  input-media-card chips inside the input area so waitForUploadChips() works.
  Set sessionStorage.__testBlockUpload = "true" to suppress chip creation
  (simulates a failed upload — used by the failure-path e2e test).
-->
<input type="file" accept="image/*" id="geminiFileInput" style="display:none" />

<!-- ── Narrow sidebar ── -->
  <aside class="sidebar">
    <button class="sidebar-btn" title="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="sidebar-btn" title="New chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Top bar -->
    <div class="topbar">
      <span class="logo-text">Gemini</span>
      <div class="topbar-right">
        <button class="upgrade-btn-top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
          Upgrade to Google AI Plus
        </button>
        <div class="avatar">U</div>
      </div>
    </div>

    <!-- Chat area -->
    <div class="chat-area" id="chatArea">
      <div class="greeting" id="greeting">
        <!-- Gemini 4-colour star -->
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
          <path d="M24 4 C24.8 4 25.5 10 25.2 24 C24.8 10 24 4 24 4Z" fill="#4285f4"/>
          <path d="M24 4 C23.2 4 22.5 10 22.8 24 C23.2 10 24 4 24 4Z" fill="#4285f4"/>
          <path d="M24 44 C24.8 44 25.5 38 25.2 24 C24.8 38 24 44 24 44Z" fill="#fbbc04"/>
          <path d="M24 44 C23.2 44 22.5 38 22.8 24 C23.2 38 24 44 24 44Z" fill="#fbbc04"/>
          <path d="M44 24 C44 24.8 38 25.5 24 25.2 C38 24.8 44 24 44 24Z" fill="#34a853"/>
          <path d="M44 24 C44 23.2 38 22.5 24 22.8 C38 23.2 44 24 44 24Z" fill="#34a853"/>
          <path d="M4 24 C4 24.8 10 25.5 24 25.2 C10 24.8 4 24 4 24Z" fill="#ea4335"/>
          <path d="M4 24 C4 23.2 10 22.5 24 22.8 C10 23.2 4 24 4 24Z" fill="#ea4335"/>
        </svg>
        <p class="greeting-hi">Hi User</p>
        <p class="greeting-sub">Where should we start?</p>
      </div>
    </div>

    <!-- Input zone -->
    <div class="input-zone">

      <div class="input-container" data-node-type="input-area">

        <!-- Contenteditable textarea (content.js: rich-textarea div.ql-editor[contenteditable]) -->
        <div class="textarea-row">
          <rich-textarea>
            <div
              class="ql-editor"
              contenteditable="true"
              role="textbox"
              aria-label="Ask Gemini"
              aria-multiline="true"
            ></div>
          </rich-textarea>
        </div>

        <!-- Controls row: mirrors real Gemini's bottom toolbar -->
        <div class="controls-row">
          <div class="controls-left">
            <!-- Attach (+) -->
            <button class="icon-btn-sm" title="Add files">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <!-- Tools -->
            <button class="icon-btn-sm" title="Tools">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.8"/></svg>
              Tools
            </button>
          </div>

          <div class="controls-right">
            <!--
              Mode picker trigger. Matches the real Gemini trigger (verified
              October 2026): signed in it always reads "Gemini Auto" — the
              thinking level is only visible on the selected menu row. The
              signed-out variant (__testSignedOut) reads "Flash-Lite".
            -->
            <button
              class="input-area-switch"
              data-test-id="bard-mode-menu-button"
              aria-label="Open mode picker, currently Gemini Auto"
              aria-haspopup="true"
              aria-expanded="false"
              id="modelTrigger"
            >
              <div data-test-id="logo-pill-label-container" class="logo-pill-label-container" id="modelLabel">
                <span class="picker-primary-text" id="modelName">Gemini</span><span class="picker-secondary-text" id="modelSub">Auto</span>
              </div>
              <!-- Chevron -->
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

            <!-- Send / mic -->
            <button class="send-button" aria-label="Send message" id="sendBtn" disabled>
              <span class="icon-send" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="icon-mic" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M5 10a7 7 0 0014 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </div>
      </div>

      <!-- Action chips -->
      <div class="chips-row" id="chipsRow">
        <button class="chip">🖼️ Create image</button>
        <button class="chip">🎵 Create music</button>
        <button class="chip">Help me learn</button>
        <button class="chip">Write anything</button>
      </div>

    </div><!-- .input-zone -->
  </div><!-- .main -->
</div><!-- .shell -->

<!--
  Mode picker overlay, copied from the real Gemini DOM (verified October 2026):
  one model row ("Auto", carries data-mode-id) then the Low / Medium / High
  thinking-level rows (no data-mode-id). The selected rows carry the
  "selected" class and a check icon. Detached from the DOM when closed, so
  content.js sees the rows disappear. Like the real menu, it closes on an
  Escape dispatched on the menu itself, not on document.
  The rows are rebuilt by the script below (renderMenu), this markup is the
  signed-in default.
-->
<gem-menu role="menu" data-test-id="gem-mode-menu" id="modelMenu" tabindex="-1">
  <gem-menu-item role="menuitem" data-mode-id="cf41b0e0dd7d53e5" data-test-id="bard-mode-option-cf41b0e0dd7d53e5" aria-disabled="false" class="selected">
    <gem-menu-item-content class="checkmark-only">
      <div class="leading-container"><gem-icon aria-label="Selected"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></gem-icon></div>
      <div class="label-container"><span class="label"> Auto </span><div class="sublabel">Gemini 3 models</div></div>
      <div class="trailing-container"></div>
    </gem-menu-item-content>
  </gem-menu-item>
  <mat-divider role="separator"></mat-divider>
  <gem-menu-item role="menuitem" aria-disabled="false" class="selected">
    <gem-menu-item-content class="checkmark-only">
      <div class="leading-container"><gem-icon aria-label="Selected"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></gem-icon></div>
      <div class="label-container"><span class="label"> Low </span><div class="sublabel">Quick and efficient</div></div>
      <div class="trailing-container"></div>
    </gem-menu-item-content>
  </gem-menu-item>
  <gem-menu-item role="menuitem" aria-disabled="false">
    <gem-menu-item-content class="checkmark-only">
      <div class="leading-container"></div>
      <div class="label-container"><span class="label"> Medium </span><div class="sublabel">Balanced depth</div></div>
      <div class="trailing-container"></div>
    </gem-menu-item-content>
  </gem-menu-item>
  <gem-menu-item role="menuitem" aria-disabled="false">
    <gem-menu-item-content class="checkmark-only">
      <div class="leading-container"></div>
      <div class="label-container"><span class="label"> High </span><div class="sublabel">Extra thorough</div></div>
      <div class="trailing-container"></div>
    </gem-menu-item-content>
  </gem-menu-item>
</gem-menu>

<script>
  const editor       = document.querySelector(".ql-editor");
  const sendBtn      = document.getElementById("sendBtn");
  const chatArea     = document.getElementById("chatArea");
  const greeting     = document.getElementById("greeting");
  const chipsRow     = document.getElementById("chipsRow");
  const modelTrigger = document.getElementById("modelTrigger");
  const modelMenu    = document.getElementById("modelMenu");
  const modelName    = document.getElementById("modelName");

  // ── Mode picker ────────────────────────────────────────────────
  //
  // Signed in (default): Auto + Low / Medium / High, Low selected (Gemini's
  // default). Test hooks, set via Playwright addInitScript() before any inline
  // script runs:
  //   __testInitialLevel = "low" | "medium" | "high"  — level selected on load
  //   __testLockedLevels = "high,medium"              — rows rendered aria-disabled
  //   __testSignedOut    = "true"                     — signed-out picker: models
  //                        only (Flash-Lite enabled, Flash / Pro disabled, plus
  //                        the "Sign in" row), no level rows
  //
  // The active level is mirrored on <html data-mock-level> so tests can assert
  // it without opening the picker (the real trigger never shows the level).
  const LEVELS = [
    { id: "low",    label: "Low",    sub: "Quick and efficient" },
    { id: "medium", label: "Medium", sub: "Balanced depth" },
    { id: "high",   label: "High",   sub: "Extra thorough" },
  ];
  const AUTO_MODE_ID = "cf41b0e0dd7d53e5";
  const CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const signedOut    = sessionStorage.getItem("__testSignedOut") === "true";
  const lockedLevels = new Set((sessionStorage.getItem("__testLockedLevels") || "").split(",").map(s => s.trim()).filter(Boolean));
  let activeLevel    = LEVELS.some(l => l.id === sessionStorage.getItem("__testInitialLevel"))
    ? sessionStorage.getItem("__testInitialLevel")
    : "low";
  let menuOpen = false;

  /** Builds one <gem-menu-item> row with the real markup. */
  function makeRow({ label, sub, selected = false, disabled = false, attrs = {} }) {
    const row = document.createElement("gem-menu-item");
    row.setAttribute("role", "menuitem");
    row.setAttribute("aria-disabled", String(disabled));
    for (const [k, v] of Object.entries(attrs)) row.setAttribute(k, v);
    if (selected) row.classList.add("selected");
    const content = document.createElement("gem-menu-item-content");
    content.className = "checkmark-only";
    const lead = document.createElement("div");
    lead.className = "leading-container";
    if (selected) lead.innerHTML = `<gem-icon aria-label="Selected">${CHECK_SVG}</gem-icon>`;
    const labels = document.createElement("div");
    labels.className = "label-container";
    const l = document.createElement("span");
    l.className = "label";
    l.textContent = ` ${label} `;
    const s = document.createElement("div");
    s.className = "sublabel";
    s.textContent = sub;
    labels.append(l, s);
    const trail = document.createElement("div");
    trail.className = "trailing-container";
    content.append(lead, labels, trail);
    row.append(content);
    return row;
  }

  /** Re-renders the menu rows from the current state. */
  function renderMenu() {
    modelMenu.replaceChildren();
    if (signedOut) {
      modelMenu.append(
        makeRow({ label: "3.5 Flash-Lite", sub: "Fastest answers", selected: true,
          attrs: { "data-mode-id": AUTO_MODE_ID, "data-test-id": `bard-mode-option-${AUTO_MODE_ID}` } }),
        makeRow({ label: "3.6 Flash", sub: "All-around help", disabled: true,
          attrs: { "data-mode-id": "", "data-test-id": "bard-mode-option-" } }),
        makeRow({ label: "3.1 Pro", sub: "Advanced reasoning", disabled: true,
          attrs: { "data-mode-id": "", "data-test-id": "bard-mode-option-" } }),
        makeRow({ label: "Sign in for all models", sub: "Try the latest Flash",
          attrs: { "data-test-id": "mode-picker-sign-in-button" } }),
      );
      return;
    }
    modelMenu.append(
      makeRow({ label: "Auto", sub: "Gemini 3 models", selected: true,
        attrs: { "data-mode-id": AUTO_MODE_ID, "data-test-id": `bard-mode-option-${AUTO_MODE_ID}` } }),
      Object.assign(document.createElement("mat-divider"), { role: "separator" }),
      ...LEVELS.map(({ id, label, sub }) => {
        const row = makeRow({ label, sub, selected: id === activeLevel, disabled: lockedLevels.has(id) });
        row.dataset.mockLevel = id; // test-only, content.js never reads it
        return row;
      }),
    );
  }

  /** Mirrors the active level on <html> for test assertions. */
  function publishLevel() {
    document.documentElement.dataset.mockLevel = signedOut ? "" : activeLevel;
  }

  function positionAndOpen() {
    renderMenu();
    const rect = modelTrigger.getBoundingClientRect();
    Object.assign(modelMenu.style, {
      position: "fixed",
      right:    Math.max(0, window.innerWidth - rect.right) + "px",
      bottom:   Math.max(0, window.innerHeight - rect.top + 6) + "px",
    });
    document.body.appendChild(modelMenu);
    modelTrigger.setAttribute("aria-expanded", "true");
    menuOpen = true;
  }

  function closeMenu() {
    if (modelMenu.parentNode) modelMenu.parentNode.removeChild(modelMenu);
    modelTrigger.setAttribute("aria-expanded", "false");
    menuOpen = false;
  }

  // Delegated listeners on the menu itself stay attached while it is detached.
  modelMenu.addEventListener("click", (e) => {
    e.stopPropagation();
    const row = e.target.closest("gem-menu-item");
    if (!row || row.getAttribute("aria-disabled") === "true") return;
    if (row.dataset.mockLevel) {
      activeLevel = row.dataset.mockLevel;
      // Simulate Angular's async change detection
      setTimeout(publishLevel, 250);
    }
    closeMenu();
  });

  // Real gem-menu: Escape only works when dispatched on the menu element.
  modelMenu.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
  });

  if (signedOut) {
    modelName.textContent = "Flash-Lite";
    document.getElementById("modelSub").remove();
    modelTrigger.setAttribute("aria-label", "Open mode picker, currently Flash-Lite");
  }
  publishLevel();
  closeMenu(); // menu starts detached

  modelTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    menuOpen ? closeMenu() : positionAndOpen();
  });

  // Close on outside click (stopPropagation inside modelMenu prevents false close)
  document.addEventListener("click", () => {
    if (menuOpen) closeMenu();
  });

  // ── Input → send button state ─────────────────────────────────────
  editor.addEventListener("input", () => {
    sendBtn.disabled = editor.innerText.trim().length === 0;
  });

  // ── Chat helpers ──────────────────────────────────────────────────
  function startChat() {
    greeting.classList.add("hidden");
    chipsRow.classList.add("hidden");
  }

  function addMessage(text, role) {
    startChat();
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap";
    const msg  = document.createElement("div");
    msg.className = "msg " + role;

    const av = document.createElement("div");
    av.className = "msg-avatar";
    if (role === "gemini") {
      av.innerHTML = `<svg viewBox="0 0 48 48" width="22" height="22" fill="none">
        <path d="M24 4 C24.8 4 25.5 10 25.2 24 C24.8 10 24 4 24 4Z" fill="#4285f4"/>
        <path d="M24 4 C23.2 4 22.5 10 22.8 24 C23.2 10 24 4 24 4Z" fill="#4285f4"/>
        <path d="M24 44 C24.8 44 25.5 38 25.2 24 C24.8 38 24 44 24 44Z" fill="#fbbc04"/>
        <path d="M24 44 C23.2 44 22.5 38 22.8 24 C23.2 38 24 44 24 44Z" fill="#fbbc04"/>
        <path d="M44 24 C44 24.8 38 25.5 24 25.2 C38 24.8 44 24 44 24Z" fill="#34a853"/>
        <path d="M44 24 C44 23.2 38 22.5 24 22.8 C38 23.2 44 24 44 24Z" fill="#34a853"/>
        <path d="M4 24 C4 24.8 10 25.5 24 25.2 C10 24.8 4 24 4 24Z" fill="#ea4335"/>
        <path d="M4 24 C4 23.2 10 22.5 24 22.8 C10 23.2 4 24 4 24Z" fill="#ea4335"/>
      </svg>`;
    } else {
      av.textContent = "U";
    }

    const body = document.createElement("div");
    body.className = "msg-body";
    body.textContent = text;

    msg.appendChild(av);
    msg.appendChild(body);
    wrap.appendChild(msg);
    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;
    return body;
  }

  function simulateResponse(userText) {
    startChat();
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap";
    const msg = document.createElement("div");
    msg.className = "msg gemini";

    const av = document.createElement("div");
    av.className = "msg-avatar";
    av.innerHTML = `<svg viewBox="0 0 48 48" width="22" height="22" fill="none">
      <path d="M24 4 C24.8 4 25.5 10 25.2 24 C24.8 10 24 4 24 4Z" fill="#4285f4"/>
      <path d="M24 4 C23.2 4 22.5 10 22.8 24 C23.2 10 24 4 24 4Z" fill="#4285f4"/>
      <path d="M24 44 C24.8 44 25.5 38 25.2 24 C24.8 38 24 44 24 44Z" fill="#fbbc04"/>
      <path d="M24 44 C23.2 44 22.5 38 22.8 24 C23.2 38 24 44 24 44Z" fill="#fbbc04"/>
      <path d="M44 24 C44 24.8 38 25.5 24 25.2 C38 24.8 44 24 44 24Z" fill="#34a853"/>
      <path d="M44 24 C44 23.2 38 22.5 24 22.8 C38 23.2 44 24 44 24Z" fill="#34a853"/>
      <path d="M4 24 C4 24.8 10 25.5 24 25.2 C10 24.8 4 24 4 24Z" fill="#ea4335"/>
      <path d="M4 24 C4 23.2 10 22.5 24 22.8 C10 23.2 4 24 4 24Z" fill="#ea4335"/>
    </svg>`;

    const body = document.createElement("div");
    body.className = "msg-body";
    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    body.appendChild(dots);

    msg.appendChild(av);
    msg.appendChild(body);
    wrap.appendChild(msg);
    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;

    const preview = userText.length > 60 ? userText.slice(0, 60) + "…" : userText;
    setTimeout(() => {
      dots.remove();
      body.textContent = `Sure! Here's what I found:\n\n"${preview}"\n\nThis is a demonstration response from the Ask Gemini extension.`;
      chatArea.scrollTop = chatArea.scrollHeight;
    }, 1400);
  }

  // ── Send ──────────────────────────────────────────────────────────
  sendBtn.addEventListener("click", () => {
    const text = editor.innerText.trim();
    if (!text) return;
    addMessage(text, "user");
    editor.innerText = "";
    editor.dispatchEvent(new Event("input", { bubbles: true }));
    simulateResponse(text);
  });

  // ── Signal ready ──────────────────────────────────────────────────
  window.__mockReady = true;

  // ── File upload chip simulation ────────────────────────────────────
  // content.js pasteImageToInput() assigns to geminiFileInput.files and fires
  // "change". We respond by appending input-media-card chips into the input
  // area — this satisfies waitForUploadChips() in UPLOAD_CHIP_SELECTORS.
  //
  // Set sessionStorage.__testBlockUpload = "true" (via addInitScript) to
  // suppress chip creation and simulate a failed upload for e2e tests.
  const geminiFileInput  = document.getElementById("geminiFileInput");
  const inputAreaForChip = document.querySelector("[data-node-type='input-area']");

  geminiFileInput.addEventListener("change", () => {
    if (sessionStorage.getItem("__testBlockUpload") === "true") return;
    [...geminiFileInput.files].forEach(f => {
      // Mirrors real Gemini: create an img with a blob: src (object URL) so that
      // the `img[src^="blob:"]` selector in UPLOAD_CHIP_SELECTORS fires first.
      const chip = document.createElement("input-media-card");
      chip.textContent = f.name;
      Object.assign(chip.style, {
        display:      "inline-block",
        padding:      "4px 8px",
        background:   "rgba(255,255,255,0.1)",
        borderRadius: "8px",
        fontSize:     "12px",
        margin:       "4px",
      });
      const thumb = document.createElement("img");
      thumb.src = URL.createObjectURL(f);
      thumb.alt = f.name;
      thumb.style.cssText = "width:40px;height:40px;object-fit:cover;border-radius:4px;display:block;";
      chip.prepend(thumb);
      inputAreaForChip.appendChild(chip);
    });
  });
</script>
</body>
</html>
